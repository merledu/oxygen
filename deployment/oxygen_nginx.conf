# Nginx configuration snippet for Oxygen RISC-V Simulator
# Place in /etc/nginx/sites-available/oxygen.conf and symlink to sites-enabled/

server {
    listen 8016;
    server_name oxygen.merledupk.org 103.4.93.50 116.213.35.22 192.168.200.56 localhost;

    client_max_body_size 50M;

    # Static files served directly by Nginx (high performance)
    location /oxygen/static/ {
        alias /home/ar/oxygen/oxygen/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all application requests to Gunicorn / Uvicorn ASGI
    location / {
        proxy_pass http://127.0.0.1:8016;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
